name: Portable core

# SieveCore is the part of Sieve that carries no Apple framework: the fourteen database
# providers, deduplication, and the shared search types. A Windows GUI is being built on
# top of it, so every push has to prove the engine still compiles off macOS. When this
# job goes red, the Windows build is broken even though the Mac app still works.

on:
  push:
    branches: [main, windows-port]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (Swift 6)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Swift on Windows compiles against the MSVC toolchain, so the C runtime module
      # maps (ucrt, visualc) only resolve inside a Visual Studio developer environment.
      # Without this the build dies on "could not build module 'ucrt'" before it reaches
      # any Swift of ours.
      - uses: compnerd/gha-setup-vsdevenv@main

      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.0.3-release
          tag: 6.0.3-RELEASE

      - name: Swift version
        run: swift --version

      - name: Build SieveCore
        run: swift build --target SieveCore -v

  linux:
    name: Linux (Swift 6)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build SieveCore
        run: swift build --target SieveCore

  macos:
    name: macOS (full app)
    # macos-14 still defaults to Swift 5.10, which cannot read a
    # swift-tools-version: 6.0 manifest at all.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build everything
        run: swift build
