<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sieve</title>
<meta name="description" content="Sieve: research you can Trust. Find, screen, read and report a literature review with every decision traced to its source.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1B19" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem("sieve-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<div id="app">
  <nav id="sidebar" aria-label="Sieve">
    <div class="brandline"><span class="wordmark">Sieve<i></i></span><button id="drawerClose" class="icon" aria-label="Close menu" data-icon="close"></button></div>
    <header>
      <button id="projectPicker" class="project" title="Switch review, or start a new one">
        <span class="project-line">
          <span id="projectName">Review</span>
          <span class="chev" aria-hidden="true" data-icon="chevronsUpDown"></span>
        </span>
        <span id="projectMeta" class="meta"></span>
      </button>
      <button id="methodLine" class="methodline" title="The steps your review follows">
        <span id="methodName">Choose a method</span>
        <span id="methodStep" class="meta"></span>
      </button>
    </header>
    <button id="paletteBtn" class="search-btn" aria-label="Search papers, screens and actions"><span data-icon="search"></span><span class="lbl">Search</span><kbd>⌘K</kbd></button>

    <div id="navlist">
      <button class="nav" data-view="overview" aria-current="true">Overview</button>
      <button class="nav" data-view="find">Find papers</button>
      <button class="nav" data-view="library">Library</button>
      <p class="navgroup">Review</p>
      <button class="nav" data-view="screening">Screening<span class="badge" id="badgeScreening"></span></button>
      <button class="nav" data-view="reader">Reader</button>
      <button class="nav" data-view="evidence">Evidence<span class="badge" id="badgeEvidence"></span></button>
      <p class="navgroup">Write up</p>
      <button class="nav" data-view="matrix">Matrix</button>
      <button class="nav" data-view="map">Map</button>
      <button class="nav" data-view="frames">Frameworks</button>
      <button class="nav" data-view="prisma">PRISMA</button>
      <button class="nav" data-view="trail">AI trail<span class="badge" id="badgeTrail"></span></button>
    </div>

    <footer>
      <button id="addBtn" class="primary" title="Add PDFs or citations"><span data-icon="plus"></span><span class="lbl">Add PDFs or citations</span></button>
      <button id="profileBtn" class="profile-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="profileMenu" title="Account, theme, backup and more">
        <span class="avatar" id="profileAvatar" aria-hidden="true"></span>
        <span class="profile-text"><span id="profileName">Not signed in</span><span id="profileState" class="meta">Saved in this browser</span></span>
        <span class="chev" aria-hidden="true" data-icon="chevronsUpDown"></span>
      </button>

      <div id="profileMenu" class="profile-menu" role="menu" hidden>
        <div class="pm-section">
          <button id="accountBtn" class="pm-account" role="menuitem">Account</button>
          <button id="syncLine" class="sync-line" hidden><span class="dot"></span><span></span></button>
        </div>
        <div class="pm-section">
          <p class="pm-label">Theme</p>
          <div class="segmented pm-theme" id="themeSeg" role="radiogroup" aria-label="Colour theme">
            <button data-theme-set="auto" role="radio">Auto</button>
            <button data-theme-set="light" role="radio">Light</button>
            <button data-theme-set="dark" role="radio">Dark</button>
          </div>
        </div>
        <div class="pm-section">
          <p class="pm-label">Your data</p>
          <div class="row">
            <button id="exportBtn" class="pm-item" role="menuitem"><span data-icon="download"></span>Back up</button>
            <button id="importBtn" class="pm-item" role="menuitem"><span data-icon="folder"></span>Restore</button>
          </div>
          <div id="safety" class="safety">
            <div class="safety-line"><span id="safetyDot" class="dot"></span><span id="safetyText">Checking…</span></div>
            <button id="folderBtn" class="quiet">Keep a copy in a folder</button>
            <p id="storage" class="hint"></p>
          </div>
        </div>
        <div class="pm-section pm-more">
          <button class="nav" data-view="method" role="menuitem">Method</button>
          <button class="nav" data-view="tags" role="menuitem">Tags<span class="badge" id="badgeTags"></span></button>
          <button class="nav" data-view="settings" role="menuitem">Settings</button>
          <button class="nav" data-view="guide" role="menuitem">Guide</button>
          <button id="shortcutsBtn" class="nav" role="menuitem"><span data-icon="keyboard"></span>Keyboard shortcuts<kbd>?</kbd></button>
        </div>
      </div>
    </footer>
  </nav>

  <div class="scrim" id="scrim"></div>
  <main>
    <header id="pagehead">
      <button id="menuBtn" class="icon" aria-label="Open menu" data-icon="menu"></button>
      <h1 id="pageTitle">Overview</h1>
      <span id="pageSub"></span>
    </header>
    <section id="overview" class="view">
      <div class="ov skeleton" aria-hidden="true"><div class="sk sk-line" style="width:48%"></div><div class="sk sk-stats"></div><div class="sk sk-line" style="width:30%"></div><div class="sk sk-row"></div><div class="sk sk-row"></div></div>
    </section>
    <section id="find" class="view hidden"></section>
    <section id="library" class="view hidden">
      <div class="bar">
        <input id="filter" type="search" placeholder="Filter by title or author" aria-label="Filter sources">
        <div id="stageSeg"></div>
        <span class="grow"></span>
        <span id="libraryCount" class="meta" aria-live="polite"></span>
        <button id="getAllPDFs" class="quiet tool-btn" title="Fetch the free PDFs that exist for records without one"><span data-icon="file"></span><span class="lbl">Get missing PDFs</span></button>
        <button id="libraryExport" class="quiet tool-btn" title="Export the library as a spreadsheet or citations"><span data-icon="download"></span><span class="lbl">Export</span></button>
      </div>
      <div id="sourceList" class="list"></div>
    </section>
    <section id="screening" class="view hidden"></section>
    <section id="reader" class="view hidden">
      <div class="reader">
        <aside id="paperRail" class="rail">
          <div class="rail-head">
            <span class="section-label">Papers</span>
            <button id="railHide" class="icon" title="Hide the paper list" aria-label="Hide the paper list" data-icon="panelLeft"></button>
          </div>
          <div class="rail-controls">
            <select id="railFilter" aria-label="Which papers to list">
              <option value="included">Included</option>
              <option value="withPDF">Has PDF</option>
              <option value="marked">Highlighted</option>
              <option value="all">All</option>
            </select>
            <span id="railCount" class="meta"></span>
          </div>
          <input id="railSearch" type="search" placeholder="Find a paper" aria-label="Find a paper">
          <div id="railList" class="rail-list"></div>
        </aside>

        <div class="reader-main">
          <div class="bar" id="readerBar">
            <button id="railShow" class="icon hidden" title="Show the paper list" aria-label="Show the paper list" data-icon="panelLeft"></button>
            <span class="titleblock">
              <strong id="readerTitle">No paper open</strong>
              <span id="readerByline" class="meta"></span>
            </span>
            <span class="grow"></span>
            <input id="findText" type="search" placeholder="Find in document" aria-label="Find in document">
            <span id="findCount" class="meta tabular"></span>
            <button id="findPrev" class="icon" aria-label="Previous match" data-icon="chevronUp"></button>
            <button id="findNext" class="icon" aria-label="Next match" data-icon="chevronDown"></button>
            <span class="sep"></span>
            <button id="zoomOut" class="icon" aria-label="Zoom out" data-icon="minus"></button>
            <button id="zoomIn" class="icon" aria-label="Zoom in" data-icon="plus"></button>
            <span id="pageLabel" class="meta tabular"></span>
          </div>

          <div class="bar-sub palette-bar">
            <div class="row-line">
              <span class="lab">Recording</span>
              <div id="stances" class="palette"></div>
              <span id="stanceBlurb" class="hint"></span>
              <span class="grow"></span>
              <button id="keysBtn" class="quiet">? keys</button>
              <button id="thoughtBtn" class="quiet accent">Add a thought</button>
            </div>
            <div class="row-line">
              <span class="lab">as</span>
              <div id="palette" class="palette"></div>
              <span class="grow"></span>
              <span id="selectionHint" class="hint">Select text, then click a colour or press its number.</span>
            </div>
          </div>

          <div id="pages" class="pages"></div>
        </div>

        <aside id="inspector">
          <div id="inspectorTabs" class="tabs"></div>
          <div id="inspectorBody" class="inspector-body"></div>
        </aside>
      </div>
    </section>
    <section id="evidence" class="view hidden">
      <div class="bar">
        <input id="evFilter" type="search" placeholder="Search your highlights" aria-label="Search highlights">
        <span class="grow"></span>
        <button id="exportEvidence" class="quiet">Markdown</button>
        <button id="exportCsv" class="quiet">CSV</button>
      </div>
      <div id="evStances" class="bar-sub"></div>
      <div id="evidenceList" class="list"></div>
    </section>
    <section id="map" class="view hidden"></section>
    <section id="matrix" class="view hidden"></section>
    <section id="frames" class="view hidden"></section>
    <section id="prisma" class="view hidden"></section>
    <section id="trail" class="view hidden"></section>
    <section id="method" class="view hidden"></section>
    <section id="guide" class="view hidden"></section>
    <section id="tags" class="view hidden">
      <div class="bar"><strong>Tags</strong><span class="grow"></span>
        <button id="addTag" class="quiet">New tag</button></div>
      <div id="tagList" class="list"></div>
    </section>
    <section id="settings" class="view hidden"></section>
  </main>
</div>

<nav id="tabbar" aria-label="Main sections">
  <button data-go="overview" aria-label="Overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-go="find" aria-label="Find papers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>Find</button>
  <button data-go="screening" aria-label="Screening"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/></svg>Screen</button>
  <button data-go="reader" aria-label="Reader"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5zM12 6.5v13"/></svg>Read</button>
  <button data-go="more" aria-label="More sections"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>More</button>
</nav>
<div id="drop" class="drop hidden"><div>Drop PDFs, or a .bib / .ris file</div></div>
<div id="toast" class="toast hidden"></div>
<div id="modal" class="modal hidden"><div class="sheet" id="modalBody"></div></div>
<input id="fileInput" type="file" accept="application/pdf,.pdf,.bib,.ris,.txt" multiple hidden>
<input id="jsonInput" type="file" accept="application/json,.json,application/zip,.zip" hidden>

<script src="vendor/supabase.js"></script>
<script src="supabase-config.js"></script>
<script type="module" src="app.js"></script>
<script type="module" src="shell.js"></script>
</body>
</html>
